name: ClearFlight-Release

# Publishes the Docker Hub image. Runs only for version tags (v*) or a manual run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  run-tests:
    name: Clearflight-Release-Checks
    runs-on: ubuntu-latest
    env:
      # Tests mock all provider calls; real keys are never needed in CI.
      AVIATIONSTACK_API_KEY: ci-dummy-key
      WEATHERSTACK_API_KEY: ci-dummy-key
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Requirements
      run: make requirements

    - name: Dev setup
      run: make dev-setup

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

    - name: Run checks
      run: make run-checks

  docker-publish:
    name: Clearflight-Docker-Publish
    runs-on: ubuntu-latest
    needs: run-tests
    # Add required reviewers to this environment in GitHub settings to gate publishing.
    environment: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/clearflightapi:latest
            ${{ secrets.DOCKER_USERNAME }}/clearflightapi:${{ github.ref_name }}
