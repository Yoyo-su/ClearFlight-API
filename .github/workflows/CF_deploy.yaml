name: ClearFlight-CI/CD

on: 
  push:
    branches:
      - main
      - 'pilot/**'
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Clearflight-Checks
    runs-on: ubuntu-latest
    env:
      # Tests mock all provider calls; real keys are never needed in CI.
      AVIATIONSTACK_API_KEY: ci-dummy-key
      WEATHERSTACK_API_KEY: ci-dummy-key
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Requirements
      run: make requirements

    - name: Dev setup
      run: make dev-setup

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

    - name: Run checks
      run: make run-checks

  docker-build:
    name: Clearflight-Docker-Build
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only. Publishing happens in the gated release workflow (release.yaml).
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: clearflightapi:ci
