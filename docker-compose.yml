services:
  clearflightapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
      WEATHERSTACK_API_KEY: ${WEATHERSTACK_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_EXPIRE: "${CACHE_EXPIRE:-3600}"
      PROVIDER_TIMEOUT: "${PROVIDER_TIMEOUT:-10}"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    # Internal Compose network only. Never publish Redis on the host.
    expose:
      - "6379"
