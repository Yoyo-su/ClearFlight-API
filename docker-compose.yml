services:
  clearflightapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
      WEATHERSTACK_API_KEY: ${WEATHERSTACK_API_KEY:-}
      # Optional hosted Redis (e.g. rediss://...); when set it overrides REDIS_HOST/REDIS_PORT.
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_EXPIRE: "${CACHE_EXPIRE:-3600}"
      PROVIDER_TIMEOUT: "${PROVIDER_TIMEOUT:-10}"
      METAR_USER_AGENT: "${METAR_USER_AGENT:-ClearFlight-API/0.1 (+https://github.com/Yoyo-su/ClearFlight-API)}"
      METAR_CACHE_TTL: "${METAR_CACHE_TTL:-600}"
      METAR_NO_DATA_CACHE_TTL: "${METAR_NO_DATA_CACHE_TTL:-300}"
      METAR_RATE_LIMIT_PER_MINUTE: "${METAR_RATE_LIMIT_PER_MINUTE:-30}"
      METAR_CURRENT_MAX_MINUTES: "${METAR_CURRENT_MAX_MINUTES:-90}"
      METAR_STALE_MAX_MINUTES: "${METAR_STALE_MAX_MINUTES:-180}"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    # Internal Compose network only. Never publish Redis on the host.
    expose:
      - "6379"
